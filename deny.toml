# Configuration used for dependency checking with cargo-deny.
#
# For further details on all configuration options see:
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
yanked = "deny"
ignore = [
  # Review 2026-12-04 UTC; scope and residual local-key exposure are documented in
  # docs/security/native-1.0.10-audit-exceptions.md. This is not remediation.
  { id = "RUSTSEC-2026-0387", reason = "Time-boxed 1.0.10 exception for crypto-bigint 0.5.5; callback signing and public-key verification do not exercise secret EC arithmetic, but local EC PEM signing remains exposed. Review 2026-12-04 UTC; enforced by the audit job. See docs/security/native-1.0.10-audit-exceptions.md." },
  { id = "RUSTSEC-2023-0071", reason = "Existing rsa 0.9.10 Marvin exception: private RSA signing remains exposed; the selected ES256 callback/public-verification profile does not use it. No fixed rsa release in the reviewed graph. Review 2026-12-04 UTC; see docs/security/native-1.0.10-audit-exceptions.md." },
  { id = "RUSTSEC-2024-0370", reason = "Existing proc-macro-error 1.0.4 unmaintained exception: build-time macro dependency, not runtime signing code. Reassess on toolchain/dependency changes; see docs/security/native-1.0.10-audit-exceptions.md." },
]

[bans]
multiple-versions = "allow" # "deny" # TODO: Re-enable when possible.

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # "CC0-1.0",
  "ISC",
  # "LicenseRef-ring",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  # "Unicode-DFS-2016",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [
  { path = "LICENSE", hash = 3171872035 }
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
