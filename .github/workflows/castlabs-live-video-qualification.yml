name: Castlabs live-video qualification

on:
  pull_request:
    branches:
      - feat/live-video-vsi
  push:
    branches:
      - feat/live-video-vsi
    tags:
      - "castlabs-live-video-v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish assets from a matching protected tag
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing protected castlabs-live-video-v* tag for publication
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: castlabs-live-video-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_BUILD_JOBS: "1"
  SDK_FEATURES: rust_native_crypto,http_reqwest,http_reqwest_blocking,add_thumbnails,file_io,fetch_remote_manifests,pdf,unstable_live_video
  FFI_FEATURES: rust_native_crypto,http,add_thumbnails,file_io,unstable_live_video
  TOOL_FEATURES: unstable_live_video

jobs:
  qualify:
    name: Qualify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            native: libc2pa_c.so
            c2patool: c2patool
            import_library: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            native: c2pa_c.dll
            c2patool: c2patool.exe
            import_library: c2pa_c.dll.lib

    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned release Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Install pinned upstream rustfmt toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master@2026-06-30
        with:
          toolchain: nightly-2026-01-16
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: castlabs-live-video-${{ matrix.target }}-rust-1.88.0

      - name: Verify checkout and qualification support
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -c "import sys; assert sys.version_info[:2] == (3, 12)"
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python scripts/castlabs_live_video_qualification.py command-manifest --target "${{ matrix.target }}" --output "qualification-work/${{ matrix.target }}/cargo-commands.json"
          cargo +1.88.0 metadata --locked --manifest-path Cargo.toml --format-version 1 --no-deps > /dev/null

      - name: Check upstream Rust formatting
        run: cargo +nightly-2026-01-16 fmt --all -- --check

      - name: Qualify SDK including live-video tests
        run: cargo +1.88.0 test --locked --lib --tests --manifest-path sdk/Cargo.toml --target ${{ matrix.target }} --no-default-features --features "${{ env.SDK_FEATURES }}"
        env:
          RUST_BACKTRACE: "1"

      - name: Qualify C FFI including live-video tests
        run: cargo +1.88.0 test --locked --manifest-path c2pa_c_ffi/Cargo.toml --target ${{ matrix.target }} --no-default-features --features "${{ env.FFI_FEATURES }}"
        env:
          RUST_BACKTRACE: "1"

      - name: Qualify c2patool default vendored-OpenSSL profile
        run: cargo +1.88.0 test --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }} --features "${{ env.TOOL_FEATURES }}"
        env:
          RUST_BACKTRACE: "1"

      - name: Capture resolved Cargo feature reports
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 tree --locked --manifest-path sdk/Cargo.toml --package c2pa --target "${{ matrix.target }}" --edges features --charset ascii --format '{p}_features=[{f}]' --no-default-features --features "$SDK_FEATURES" > "qualification-work/${{ matrix.target }}/sdk-features.txt"
          cargo +1.88.0 tree --locked --manifest-path c2pa_c_ffi/Cargo.toml --package c2pa-c-ffi --target "${{ matrix.target }}" --edges features --charset ascii --format '{p}_features=[{f}]' --no-default-features --features "$FFI_FEATURES" > "qualification-work/${{ matrix.target }}/ffi-features.txt"
          cargo +1.88.0 tree --locked --manifest-path cli/Cargo.toml --package c2patool --target "${{ matrix.target }}" --edges features --charset ascii --format '{p}_features=[{f}]' --features "$TOOL_FEATURES" > "qualification-work/${{ matrix.target }}/c2patool-features.txt"

      - name: Build release native library and c2patool from same SHA
        shell: bash
        run: |
          set -euo pipefail
          rm -f "target/${{ matrix.target }}/release/c2pa.h"
          touch c2pa_c_ffi/build.rs
          cargo +1.88.0 build --locked --release --manifest-path c2pa_c_ffi/Cargo.toml --target "${{ matrix.target }}" --no-default-features --features "$FFI_FEATURES"
          test -f "target/${{ matrix.target }}/release/c2pa.h"
          cargo +1.88.0 build --locked --release --manifest-path cli/Cargo.toml --target "${{ matrix.target }}" --features "$TOOL_FEATURES"

      - name: Verify release exports, generated header, and c2patool smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/castlabs_live_video_qualification.py verify-symbols --target "${{ matrix.target }}" --library "target/${{ matrix.target }}/release/${{ matrix.native }}"
          python scripts/castlabs_live_video_qualification.py verify-header --header "target/${{ matrix.target }}/release/c2pa.h"
          python scripts/castlabs_live_video_qualification.py verify-c2patool-help --executable "target/${{ matrix.target }}/release/${{ matrix.c2patool }}"

      - name: Emit source qualification evidence and deterministic bundle
        shell: bash
        env:
          RUNNER_IMAGE_FACT: ${{ runner.environment }}-${{ matrix.os }}
        run: |
          set -euo pipefail
          work="qualification-work/${{ matrix.target }}"
          dist="dist/${{ matrix.target }}"
          mkdir -p "$dist"
          evidence="$work/source-qualification.json"
          evidence_sha="$work/source-qualification.json.sha256"
          commands="$work/cargo-commands.json"
          bundle="$dist/castlabs-c2pa-live-video-${GITHUB_SHA}-${{ matrix.target }}.tar.gz"
          bundle_sha="${bundle}.sha256"
          native="target/${{ matrix.target }}/release/${{ matrix.native }}"
          tool="target/${{ matrix.target }}/release/${{ matrix.c2patool }}"
          header="target/${{ matrix.target }}/release/c2pa.h"
          artifact_args=(--artifact "native=$native" --artifact "c2patool=$tool" --artifact "header=$header")
          bundle_args=(--file "$native=lib/${{ matrix.native }}" --file "$tool=bin/${{ matrix.c2patool }}" --file "$header=include/c2pa.h")
          if [ -n "${{ matrix.import_library }}" ]; then
            import_library="target/${{ matrix.target }}/release/${{ matrix.import_library }}"
            artifact_args+=(--artifact "importLibrary=$import_library")
            bundle_args+=(--file "$import_library=lib/${{ matrix.import_library }}")
          fi
          python scripts/castlabs_live_video_qualification.py evidence \
            --source-sha "$GITHUB_SHA" --cargo-lock Cargo.lock --command-manifest "$commands" \
            --target "${{ matrix.target }}" \
            --feature-report "c2pa=$work/sdk-features.txt" \
            --feature-report "c2pa-c-ffi=$work/ffi-features.txt" \
            --feature-report "c2patool=$work/c2patool-features.txt" \
            "${artifact_args[@]}" \
            --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" \
            --runner-name "$RUNNER_NAME" --runner-image "$RUNNER_IMAGE_FACT" \
            --output "$evidence" --sha256-output "$evidence_sha"
          python scripts/castlabs_live_video_qualification.py bundle \
            "${bundle_args[@]}" \
            --file "$evidence=qualification/source-qualification.json" \
            --file "$evidence_sha=qualification/source-qualification.json.sha256" \
            --file "$commands=qualification/cargo-commands.json" \
            --file "$work/sdk-features.txt=qualification/sdk-features.txt" \
            --file "$work/ffi-features.txt=qualification/ffi-features.txt" \
            --file "$work/c2patool-features.txt=qualification/c2patool-features.txt" \
            --output "$bundle" --sha256-output "$bundle_sha"

      - name: Upload qualification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: castlabs-live-video-${{ github.sha }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Castlabs qualification release
    needs: qualify
    if: >-
      (github.event_name == 'push' &&
       github.ref_type == 'tag' &&
       startsWith(github.ref, 'refs/tags/castlabs-live-video-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: castlabs-live-video-release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Require matching protected release tag
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        shell: bash
        run: |
          set -euo pipefail
          tag_pattern='^castlabs-live-video-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $tag_pattern ]]; then
            echo "Release tag must contain a valid version: $RELEASE_TAG" >&2
            exit 1
          fi
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$REF_PROTECTED" = "true"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

      - name: Require immutable-releases setting attestation
        env:
          IMMUTABLE_RELEASES_ATTESTED: ${{ vars.CASTLABS_GITHUB_IMMUTABLE_RELEASES_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$IMMUTABLE_RELEASES_ATTESTED" != "true" ]; then
            echo "Set CASTLABS_GITHUB_IMMUTABLE_RELEASES_ENABLED=true only after enabling GitHub immutable releases for this repository." >&2
            echo "The workflow cannot verify that repository setting through the GitHub API; this variable is the required operator attestation." >&2
            exit 1
          fi

      - name: Download all successful platform bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: castlabs-live-video-${{ github.sha }}-*
          path: dist
          merge-multiple: true

      - name: Verify complete release asset set and qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys; assert sys.version_info[:2] == (3, 12)"
          python scripts/castlabs_live_video_qualification.py verify-release-assets \
            --directory dist --source-sha "$GITHUB_SHA" --cargo-lock Cargo.lock \
            --target x86_64-unknown-linux-gnu \
            --target x86_64-pc-windows-msvc

      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url --jq '"draft=\(.isDraft) url=\(.url)"' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "Release $RELEASE_TAG already exists ($existing); no-clobber publication refuses overwrite." >&2
            echo "If this is a stale draft, inspect it and delete it explicitly with: gh release delete '$RELEASE_TAG' --repo '$GITHUB_REPOSITORY' --yes" >&2
            exit 1
          fi

      - name: Attest qualified bundles and checksums
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Publish complete release without asset replacement
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          created=0
          cleanup_draft() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$created" -eq 1 ]; then
              if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
                gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes || echo "Failed to remove draft; delete it explicitly before retrying: gh release delete '$RELEASE_TAG' --repo '$GITHUB_REPOSITORY' --yes" >&2
              fi
            fi
            exit "$status"
          }
          trap cleanup_draft EXIT
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Castlabs live-video qualification $RELEASE_TAG" \
            --notes "Castlabs fork live-video qualification artifacts for source $GITHUB_SHA." \
            --draft
          created=1
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          created=0
          trap - EXIT
