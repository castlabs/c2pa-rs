name: VSI update validation

on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vsi-update-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsi-update-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TEST_THREADS: "1"
  RUST_BACKTRACE: "1"

jobs:
  sdk:
    name: VSI SDK (${{ matrix.crypto }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crypto: [rust_native_crypto, openssl]
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install SDK MSRV and Clippy
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: vsi-update-sdk-${{ matrix.crypto }}
      - name: Test live-video SDK with isolated crypto backend
        run: cargo +1.96.0 test --locked -p c2pa --lib --no-default-features --features ${{ matrix.crypto }},unstable_live_video live_video::
      - name: Lint live-video SDK
        run: cargo +1.96.0 clippy --locked -p c2pa --lib --no-default-features --features ${{ matrix.crypto }},unstable_live_video -- -D warnings
      - name: Check feature-off SDK
        run: cargo +1.96.0 check --locked -p c2pa --lib --no-default-features --features ${{ matrix.crypto }}

  cli:
    name: VSI CLI tests and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install release toolchain and Clippy
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: vsi-update-cli
      - name: Test CLI including subprocess output regressions
        run: cargo +1.96.0 test --locked -p c2patool --features unstable_live_video
      - name: Lint CLI including tests
        run: cargo +1.96.0 clippy --locked -p c2patool --features unstable_live_video --all-targets -- -D warnings
